# Project
license=LGPL-3.0-only
issue_tracker=https://github.com/AssortedMods/AssortedMobs/issues
# The mods this repository builds, each a directory under mods/ with its own gradle.properties.
family_name=Assorted Mobs
# The namespace the mods share - creative tab, manual section, advancement root, their old ids - and
# what those are drawn with, the first of these installed. Generated into each mod as its Family class.
family_id=assortedmobs
family_icons=assortedeightbit:bobomb,assortedseacreatures:narwhal_horn,assortedicepixie:ice_pixie_spawn_egg,assortedtreasuremob:treasure_mob_spawn_egg
family_manual_order=70
assorted_mods=mobs,icepixie,treasuremob,eightbit,seacreatures
# Build
# The AssortedBuild release these mods build with. Minecraft, NeoForge, Fabric and tooling versions
# all come from it; bump it to move to a newer set.
assortedbuild_version=26.2.6
# Mod Options
mod_author=Grim3212
# The AssortedLib these mods need: its minimum, declared as such on both loaders.
assortedlib_version=4.3.0
# Knobs. Absent means off; a mod's own gradle.properties can turn one on for itself.
jei_enabled=false
neoforge_ats_enabled=false
common_runs_enabled=false
# The default release channel: release, beta or alpha. -PreleaseType overrides it.
release_type=release
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
